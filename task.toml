artifacts = ["/app/report.json"]

[task]
name = "dynamo/log-report"
description = "Parse an Apache-style access log into a small JSON summary report."

[metadata]
category = "data_processing_and_etl"
subcategory = "text_processing"
task_objective = ["transform", "generate"]
artifact_type = ["text_or_log_file", "generated_output_artifact"]
expert_time_estimate_hours = 0.3
model_tested = "GPT-5.4"
agent_tested = "Terminus-2"
difficulty_explanation = "Requires parsing HTTP access logs to extract IP addresses, request paths, and total counts, producing a structured JSON summary."
solution_explanation = "Parse /app/access.log line by line, count requests and distinct IPs, determine the most frequent path using Counter, and output JSON to /app/report.json."
verification_explanation = "pytest verifies that /app/report.json exists, is valid JSON, and contains the exact expected values for total_requests, unique_ips, and top_path."

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 120.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []
